# Cubic Data Dashboard — nginx vhost.
#
# Install as its own file so the existing scrapper.yalabyte.com vhosts on this
# box are never touched:
#   /etc/nginx/sites-available/cubic-dashboard  ->  symlink into sites-enabled
#
# __DOMAIN__ is substituted by deploy-from-mac.sh.
# Run certbot AFTER this is live on :80 — it rewrites this file to add TLS.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Let certbot answer the ACME challenge before the proxy_pass catch-all.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Pages revalidate on every request (Cache-Control set by the app).
    # Hashed /_next/static/ files are immutable.
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # siteOrigin() in src/lib/auth/config.ts trusts these two when
        # AUTH_SITE_URL is unset. AUTH_SITE_URL is set explicitly in
        # .env.production, so the OAuth redirect_uri cannot drift.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Immutable build assets.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    client_max_body_size 25m;
}
