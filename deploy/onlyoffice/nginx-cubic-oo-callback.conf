# Entrypoint for the ONLYOFFICE Document Server container to call back into the
# Cubic backend.
#
# cubic-backend binds 127.0.0.1:3010, which a container cannot reach — its own
# loopback is not the host's. The scrapper stack solved this with the same shape
# (nginx :5556 -> 127.0.0.1:5555, see Karki_Scrapper/deploy/godaddy/
# nginx-karki-oo-callback.conf); this is the Cubic equivalent.
#
# NEVER open this port to the internet. ufw must allow 5557 in on the docker0
# interface only:
#   sudo ufw allow in on docker0 to any port 5557 proto tcp
#
# Install:
#   sudo cp nginx-cubic-oo-callback.conf /etc/nginx/sites-available/cubic-oo-callback
#   sudo ln -s /etc/nginx/sites-available/cubic-oo-callback /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 5557;
    listen [::]:5557;
    server_name _;

    # Resumes and conversions are larger and slower than the nginx defaults.
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
